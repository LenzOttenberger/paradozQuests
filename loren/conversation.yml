conversations:
  Loren:
    quester: "Лорен"
    first: "default"

    NPC_options:

      ##############################################
      #    ГЛАВА 1 Доп. 1.2
      ##############################################

      #######################
      #   q001.2 - квест 1.2
      #######################
      default:
        text: "М? Что нужно?"

      q001.2_start:
        text: "Не люблю просить о помощи. Но выбора нет./nРаньше я часто ходил в разведку. Теперь далеко не уйду. Нога уже не та./nУ меня остались старые метки за пределами деревни. Проверь, сохранились ли они."
        actions: "start_q001.2,q001.2_talk_1"
      q001.2_check:
        text: "Ты сходил на разведку?"
        conditions: "q001.2_active"
        pointers: "q001.2_notyet"
      q001.2_fin:
        text: "Все на месте?"
        pointers: "q001.2_1"
        actions: "q001.2_talk_2"
      q001.2_fin1:
        text: "Хорошо. Странно…"
        pointers: "q001.2_2"
        actions: "q001.2_talk_3"
      q001.2_fin2:
        text: "Привычка. Каждый раз жду, что однажды их не окажется./nСпасибо. Теперь хоть переживать не буду… Какое-то время."
        actions: "finish_q001.2,q001.2_talk_4"

    player_options:

      ##############################################
      #    ГЛАВА 1 Доп. 1.2
      ##############################################

      #######################
      #   q001.2 - квест 1.2
      #######################

      q001.2_1:
        text: "Да. Всё на месте."
        pointers: "q001.2_fin1"
      q001.2_2:
        text: "Что странно?"
        pointers: "q001.2_fin2"
      q001.2_notyet:
        text: "Ещё нет."