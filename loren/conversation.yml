conversations:
  Loren:
    quester: "Лорен"
    first: "default"

    NPC_options:

      ##############################################
      #    ГЛАВА 1 Доп. 1.2 q001_2_fin,q001_2_check,q001_2_start,
      ##############################################

      #######################
      #   q001_2 - квест 1.2
      #######################
      default:
        text: "М? Что нужно?"

      q001_2_start:
        text: "Не люблю просить о помощи. Но выбора нет.\nРаньше я часто ходил в разведку. Теперь далеко не уйду. Нога уже не та.\nУ меня остались старые метки за пределами деревни. Проверь, сохранились ли они."
        actions: "start_q001_2,q001_2_talk_1"
        conditions: "paradozQuests-roy>q001_1_done,paradozQuests-edwin>q001_done,!q001_2_done,!q001_2_active"
      q001_2_check:
        text: "Ты сходил на разведку?"
        conditions: "q001_2_active,!q001_2_done"
        pointers: "q001_2_notyet"
      q001_2_fin:
        text: "Все на месте?"
        pointers: "q001_2_1"
        actions: "q001_2_talk_2"
        conditions: "q001_2_active,q001_2_locs,!q001_2_done"
      q001_2_fin1:
        text: "Хорошо. Странно…"
        pointers: "q001_2_2"
        actions: "q001_2_talk_3"
      q001_2_fin2:
        text: "Привычка. Каждый раз жду, что однажды их не окажется.\nСпасибо. Теперь хоть переживать не буду… Какое-то время."
        actions: "q001_2_reward,finish_q001_2,q001_2_inc,q001_2_talk_4"

    player_options:

      ##############################################
      #    ГЛАВА 1 Доп. 1.2
      ##############################################

      #######################
      #   q001_2 - квест 1.2
      #######################

      q001_2_1:
        text: "Да. Всё на месте."
        pointers: "q001_2_fin1"
      q001_2_2:
        text: "Что странно?"
        pointers: "q001_2_fin2"
      q001_2_notyet:
        text: "Ещё нет."