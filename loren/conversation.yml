      q001.2_start:
        text: "Не люблю просить о помощи. Но выбора нет./nРаньше я часто ходил в разведку. Теперь далеко не уйду. Нога уже не та./nУ меня остались старые метки за пределами деревни. Проверь, сохранились ли они."
