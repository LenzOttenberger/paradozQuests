      q001.2_fin:
        text: "Все на месте?"
        pointers: "q001.2_1"
      q001.2_fin1:
        text: "Хорошо. Странно…"
        pointers: "q001.2_2"
      q001.2_fin2:
        text: "Привычка. Каждый раз жду, что однажды их не окажется./nСпасибо. Теперь хоть переживать не буду… Какое-то время."
        actions: "finish_q001.2"

    player_options:

      ##############################################
      #    ГЛАВА 1 Доп. 1.2
      ##############################################

      #######################
      #   q001.2 - квест 1.2
      #######################

