conversations:
  Lia:
    quester: "Лия"
    first: "q001_active,default"

    NPC_options:

      ############################################################################################
      #    ГЛАВА 1 q002_1_fin5,q002_1_check,q002_1_start,q002_outro,q002_check,q002_intro,
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Здравствуйте."
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "Здравствуйте. Вам чем-нибудь помочь?\nА… Ещё один от Эдвина. Понятно.\nЯ Лия, врач. Лечу бесплатно. Можешь идти."
        pointers: "q001_why,q001_leave"
        actions: "q001_talk_1"
      q001_more:
        text: "Да. Целый день ко мне подходят такие как ты. Потерянные котята.\nИзвини. Том испортил всё настроение. Всё доставал меня своими просьбами.\nХотел чтобы я целый день следила за состоянием здоровья его жены.\nИди, котёнок. Дай мне побыть одной."
        actions: "q001_stage,q001_talk_2"

      #######################
      #    q002 - квест 2.0
      #######################

      q002_intro:
        text: "У жены Тома опять болит спина.\nИ угадай кто уже третий раз за неделю прибегал ко мне с криками 'она умирает'?"
        pointers: "q002_why"
        actions: "q002_talk_1"
        conditions: "paradozQuests-edwin>q001_done,paradozQuests-roy>q001_1_done,paradozQuests-loren>q001_2_done"
      q002_start:
        text: "Потому что ты мне поможешь. Нет, серьёзно. Я осмотрела Элизу вчера. И позавчера.\nИ позапозавчера. Она жива. Просто ей нужен отдых и некоторые лекарства."
        pointers: "q002_why2"
        actions: "q002_talk_2"
      q002_start2:
        text: "В том, что закончились травы.\nА Том вместо того, чтобы собрать их сам, бегает по деревне и мешает работать.\nПоэтому поможешь мне ты, котёнок."
        actions: "q002_talk_3"
        pointers: "q002_con"
      q002_start3:
        text: "Принеси 8 ромашек и 6 одуванчиков. Буду ждать."
        actions: "q002_talk_4,start_q002"
      q002_check:
        text: "Ты уже всё собрал?"
        conditions: "q002_active,!q002_flowers,!q002_done"
        pointers: "q002_notyet"
      q002_outro:
        text: "Вижу, ты вернулся, котёнок. Надеюсь, не с пустыми руками.\nОтлично. Хоть один человек сегодня оказался полезнее Тома.\nНе говори ему, что я это сказала. Он хороший человек.\nПросто... Когда дело касается Элизы, он начинает видеть конец света в каждой царапине."
        conditions: "q002_flowers,q002_active,!q002_done"
        pointers: "q002_end"
        actions: "q002_talk_5,q002_take"
      q002_finish:
        text: "Знаю. Именно поэтому я до сих пор его не придушила.\nСходи к Тому и скажи, чтобы он приходил за лекарством, котёнок."
        actions: "finish_q002,q002_inc,q002_reward,q002_tom_start,q002_tom_active,q002_talk_6"


      ##############################################
      #    ГЛАВА 1 Доп. 2.1
      ##############################################

      #######################
      #   q002_1 - квест 2.1
      #######################

      q002_1_start:
        text: "Мой брат опять отказывается лечиться. Человек приходит ко мне только тогда, когда уже почти разваливается."
        pointers: "q002_1_1"
        actions: "q002_1_talk_1"
        conditions: "q002_done,paradozQuests-tom>q002_tom_done"
      q002_1_start1:
        text: "Корвин. Найди его. И передай, что если он не придёт сам, я приду за ним лично."
        actions: "q002_1_talk_2,start_q002_1"
      q002_1_check:
        text: "Ты уже нашёл Корвина? Он где-то в переулках наверняка."
        conditions: "q002_1_active,q002_1_lia,!q002_1_done"
        pointers: "q002_1_not"
      #######################
      # Переход к Корвину и снава к Лие
      #######################
      q002_1_fin5:
        text: "Он опять соврал?"
        pointers: "q002_1_5"
        actions: "q002_1_talk_3"
        conditions: "q002_1_active,!q002_1_done,q002_1_lia,paradozQuests-korvin>q002_1_korvin"
      q002_1_fin6:
        text: "Как неожиданно. Спасибо, котёнок. Теперь моя очередь его искать."
        actions: "finish_q002_1,q002_1_reward,q002_1_talk_4,q002_1_inc"





    player_options:

      ############################################################################################
      #       ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      q001_why:
        text: "А? Это всё?"
        pointers: "q001_more"
      q001_leave:
        text: "*Уйти*" 
        pointers: "q001_more"

      #######################
      #    q002 - квест 2.0
      #######################
      
      q002_why:
        text: "И при чём тут я?"
        pointers: "q002_start"
      q002_why2:
        text: "Тогда в чём проблема?"
        pointers: "q002_start2"
      q002_con: 
        text: "..."
        pointers: "q002_start3"
      q002_notyet:
        text: "Ещё нет."
      q002_end:
        text: "Он очень переживает за неё."
        pointers: "q002_finish"

      ##############################################
      #    ГЛАВА 1 Доп. 2.1
      ##############################################

      #######################
      #   q002_1 - квест 2.1
      #######################

      q002_1_1:
        text: "Кто твой брат?"
        pointers: "q002_1_start1"
      q002_1_5:
        text: "Да. Кажется у него была сломана рука."
        pointers: "q002_1_fin6"
      q002_1_not:
        text: "Ещё нет."