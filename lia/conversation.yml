conversations:
  Lia:
    quester: "Лия"
    first: "q001_done,q001_active,default"

    NPC_options:

      #######################
      #    defadult
      #######################

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Здравствуйте."
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "Здравствуйте. Вам чем-нибудь помочь?\nА… Ещё один от Эдвина. Понятно.\nЯ Лия, врач. Лечу бесплатно. Можешь идти."
        pointers: "q001_why,q001_leave"
      q001_more:
        text: "Да. Целый день ко мне подходят такие как ты. Потерянные котята.\nИзвини. Том испортил всё настроение. Всё доставал меня своими просьбами.\nХотел чтобы я целый день следила за состоянием здоровья его жены.\nИди, котёнок. Дай мне побыть одной."
        actions: "q001_stage"

    player_options:

      #######################
      #    default
      #######################

      #######################
      #    q001 - квест 1.0
      #######################

      q001_why:
        text: "А? Это всё?"
        pointers: "q001_more"
      q001_leave:
        text: "Уйти"
        pointers: "q001_more"