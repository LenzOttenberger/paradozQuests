conversations:
  Lia:
    quester: "Лия"
    first: "q001_done,q001_active,default"

    NPC_options:

      #######################
      #    defadult
      #######################

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Здравствуйте."
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "Здравствуйте. Вам чем-нибудь помочь?\nА… Ещё один от Эдвина. Понятно.\nЯ Лия, врач. Лечу бесплатно. Можешь идти."
        pointers: "q001_why,q001_leave"
      q001_more:
        text: "Да. Целый день ко мне подходят такие как ты. Потерянные котята.\nИзвини. Том испортил всё настроение. Всё доставал меня своими просьбами.\nХотел чтобы я целый день следила за состоянием здоровья его жены.\nИди, котёнок. Дай мне побыть одной."
        actions: "q001_stage"

       #######################
      #    q002 - квест 2.0
      #######################

      q002_intro:
        text: "О, ты как раз вовремя, котёнок. У нас тут снова что-то странное происходит. В деревне слишком тихо. Это хуже чем шум. Мне нужно проверить, что все жители в порядке. Поможешь?"
        pointers: "q002_yes,q002_why"
      q002_start:
        text: "Отлично. Тогда проверь Тома, Эдвина и ещё одного жителя. Просто убедись, что с ними всё нормально."
        actions: "start_q002"
      q002_check:
        text: "Ты уже проверил всех?"
        conditions: "q002_active,!q002_done"
        pointers: "q002_notyet"
      q002_outro:
        text: "Слишком спокойно… Мне это не нравится. Но раз ты говоришь, что всё нормально… я поверю тебе."
        conditions: "q002_done"
        pointers: "q002_end"
      q002_finish:
        text: "Ладно. Спасибо тебе, котёнок. Держи немного лекарств — на всякий случай."
        actions: "finish_q002"

    player_options:

      #######################
      #    default
      #######################

      #######################
      #    q001 - квест 1.0
      #######################

      q001_why:
        text: "А? Это всё?"
        pointers: "q001_more"
      q001_leave:
        text: "Уйти"
        pointers: "q001_more"

      #######################
      #    q002 - квест 2.0
      #######################
      
      q002_yes:
        text: "Да, помогу."
        actions: "start_q002"
      q002_why:
        text: "Почему это важно?"
        pointers: "q002_start"
      q002_notyet:
        text: "Ещё нет."
      q002_end:
        text: "Надеюсь, ты ошибаешься."
        pointers: "q002_finish"