conversations:
  Tom:
    quester: "Том"
    first: "q001_done,q001_active,default"

    NPC_options:

      ############################################################################################
      #    ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Привет!"
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "Ого! Ещё один храбрый герой?\nНе хочешь работёнку? Мне нужны травы, кучу трав целительных.\nОчень беспокоюсь за свою жёнушку. Утром у неё прихватило спину! Я так испугался, а наша лекарка не хочет помогать…"
        pointers: "q001_continue"
      q001_end:
        text: "Ну как… Она, конечно, дала средства, но не захотела посмотреть на состояние жены лично!\n…\nЯ так больше не могу! Жёнушка, я бегу!"
        actions: "q001_stage"

      #######################
      #    q002.1 - квест 2.1
      #######################

      q002_tom:
        text: "Привет, храбрый герой!\nЕсли ты пришёл поработать, то я уже придумал для тебя ещё одно задание!\nХотя... Подожди. Ты пришёл от Лии?"
        pointers: "q002_1"
      q002_gde:
        text: "Правда? Она наконец приготовила лекарство?\nОтлично! Я уже начал переживать. Ну... И где оно?"
        pointers: "q002_2"
      q002_vopr:
        text: "А? Сама не принесёт? Ну конечно...\nОна до сих пор сердится?\nЭх... Не понимаю я её иногда. Разве можно так спокойно относиться к здоровью человека?\nВот представь. Утром у Элизы заболела спина.\nА если это что-то серьёзное?  А если станет хуже? А если..."
        pointers: "q002_3"
      q002_prosto:
        text: "Да?\n...\nЛадно. Наверное, я опять накручиваю себе. Просто...\nКогда рядом почти никого нет, начинаешь дорожить теми, кто остался. Понимаешь?"
        pointers: "q002_4,q002_4.1"
      q002_prin:
        text: "Хорошо. Значит, я не выгляжу совсем уж сумасшедшим. Хах\nСпасибо тебе. И за помощь Лии тоже спасибо. Она может казаться ворчливой, но она очень хороший человек.\nТолько не говори ей, что я это сказал."
        pointers: "q002_5,q002_5.1"
      q002_55:
        text: "Отлично. А то мне потом придётся выслушивать её лекцию о том, что я опять драматизирую.\nЛадно. Пойду за лекарством. И проверю, как там моя жёнушка.\nНадеюсь, пока мы разговаривали, она не решила поднять шкаф самостоятельно. Потому что в прошлый раз это закончилось очень плохо."
        actions: "finish_q002.1"
      q002_55.1:
        text: "Постарайся не рассказать. А то мне потом придётся выслушивать её лекцию о том, что я опять драматизирую.\nЛадно. Пойду за лекарством. И проверю, как там моя жёнушка.\nНадеюсь, пока мы разговаривали, она не решила поднять шкаф самостоятельно. Потому что в прошлый раз это закончилось очень плохо."
        actions: "finish_q002.1"





      ############################################################################################
      #    ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

    player_options:

      q001_continue:
        text: "..."
        pointers: "q001_end"

      #######################
      #    q002.1 - квест 2.1
      #######################
      q002_1:
        text: "Да"
        pointers: "q002_gde"
      q002_2:
        text: "Она сказала, чтобы ты сам за ним пришёл."
        pointers: "q002_vopr"
      q002_3:
        text: "Том..."
        pointers: "q002_prosto"
      q002_4:
        text: "Понимаю."
        pointers: "q002_prin"
      q002_4.1:
        text: "Ну...Наверное?"
        pointers: "q002_prin"
      q002_5:
        text: "Не скажу"
        pointers: "q002_55"
      q002_5.1:
        text: "Я подумаю..."
        pointers: "q002_55.1"