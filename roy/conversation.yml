conversations:
  Roy:
    quester: "Рой"
    first: "q001_done,q001_active,default"

    NPC_options:

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Привет!"
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "О! Мой телепорт сработал?"
        pointers: "q001_yes,q001_no"
      q001_yes:
        text: "ДА! Увидел ваши странные столбы, которые телепортируют, и попробовал построить такой в наш город."
        pointers: "q001_continue"
      q001_no:
        text: "Ха-ха. Смешная шутка!"
        pointers: "q001_continue"
      q001_end:
        text: "Я Рой, приятно познакомиться! Мастер на все руки, могу что-нибудь починить, но, конечно, за плату.\nУверен, что тебя прислал Эдвин. Мой братишка, горжусь им! Думаю, у тебя ещё есть дела.\nПока-пока!"
        actions: "q001_stage"

      #######################
      #    q002 - квест 2.0
      #######################

    player_options:

      #######################
      #    q001 - квест 1.0
      #######################

      q001_yes:
        text: "Это ты его построил?"
        pointers: "q001_yes"
      q001_no:
        text: "Нет."
        pointers: "q001_no"
      q001_continue:
        text: "..."
        pointers: "q001_end"