conversations:
  Roy:
    quester: "Рой"
    first: "q001_1_fin,q001_1_check,q001_1_start,q001_active,default"

    NPC_options:

      ############################################################################################
      #    ГЛАВА 1 q001_1_fin,q001_1_check,q001_1_start,
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Привет!"
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "О! Мой телепорт сработал?"
        pointers: "q001_yes,q001_no"
        actions: "q001_talk_1"
      q001_yes:
        text: "ДА! Увидел ваши странные столбы, которые телепортируют, и попробовал построить такой в наш город."
        pointers: "q001_continue"
        actions: "q001_talk_2"
      q001_no:
        text: "Ха-ха. Смешная шутка!"
        pointers: "q001_continue"
        actions: "q001_talk_3"
      q001_end:
        text: "Я Рой, приятно познакомиться! Мастер на все руки, могу что-нибудь починить, но, конечно, за плату.\nУверен, что тебя прислал Эдвин. Мой братишка, горжусь им! Думаю, у тебя ещё есть дела.\nПока-пока!"
        actions: "q001_stage,q001_talk_4"


      ##############################################
      #    ГЛАВА 1 Доп. 1.1
      ##############################################

      #######################
      #   q001_1 - квест 1.1
      #######################

      q001_1_start:
        text: "Привет! У меня маленькая проблема. Совсем маленькая.\nНастолько маленькая, что я ищу её уже два часа. Я потерял чертёж."
        pointers: "q001_1_1"
        actions: "q001_1_talk_1"
        conditions: "paradozQuests-edwin>q001_done,!q001_1_active,!q001_1_done"
      q001_1_start1:
        text: "Отличный вопрос! Если бы я помнил, чего именно, найти его было бы проще.\nНо точно чего-то важного. Наверное. В общем, помоги найти мои записи.\nДолжно быть 4 листа чертежей, я сегодня ходил по всей деревне и где-то оставил их."
        actions: "start_q001_1,q001_1_talk_2"
      q001_1_check:
        text: "Нашёл чертежи? Я уверен они около моего дома."
        conditions: "q001_1_active,!q001_1_done"
        pointers: "q001_1_notyet"
      q001_1_fin:
        text: "Нашёл? Замечательно! Хм... Теперь вспомнил.\nЭто был чертёж сарая."
        pointers: "q001_1_2"
        actions: "q001_1_talk_3,q001_1_take"
        conditions: "q001_1_active,q001_1_pick"
      q001_1_fin1:
        text: "Какой сарай?"
        pointers: "q001_1_3"
        actions: "q001_1_talk_4"
      q001_1_fin2:
        text: "А. Его я так и не построил. Зато чертёж сохранился!\nСпасибо тебе огромное!"
        actions: "q001_1_talk_5,q001_1_inc"



    player_options:

      ############################################################################################
      #    ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      q001_yes:
        text: "Это ты его построил?"
        pointers: "q001_yes"
      q001_no:
        text: "Нет."
        pointers: "q001_no"
      q001_continue:
        text: "..."
        pointers: "q001_end"

      ##############################################
      #    ГЛАВА 1 Доп. Квесты
      ##############################################

      #######################
      #   q001_1 - квест 1.1
      #######################

      q001_1_1:
        text: "Чертёж чего?"
        pointers: "q001_1_start1"
      q001_1_2:
        text: "И где сарай?"
        pointers: "q001_1_fin1"
      q001_1_3:
        text: "Тот, который ты строил."
        pointers: "q001_1_fin2"
      q001_1_notyet:
        text: "Пока нет."