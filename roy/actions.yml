  q001_1_take: "take paper:4"
  q001_1_kill_item1: 'command /kill @e[type=item_frame,x=349,y=31,z=333,distance=..1]'
  q001_1_kill_item2: 'command /kill @e[type=item_frame,x=348,y=31,z=326,distance=..1]'
  q001_1_kill_item3: 'command /kill @e[type=item_frame,x=334,y=29,z=326,distance=..1]'
