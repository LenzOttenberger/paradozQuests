conversations:
  Eliza:
    quester: "Элиза"
    first: "default"

    NPC_options:

      ############################################################################################
      #       ГЛАВА 1 q002,q002_2_fin,q002_2_check,q002_2_start,
      ############################################################################################

      ##############################################
      #    ГЛАВА 1 Доп. 2.2
      ##############################################

      #######################
      #   q002_2 - квест 2.2
      #######################
      default:
        text: "Здравствуй."

      q002_2_start:
        text: "Хорошо, что ты тут. Мне нужна помощь.\nИ нет, я не умираю. Если Том расскажет тебе обратное, не верь ему.\nМожешь собрать для меня цветы?"
        pointers: "q002_2_1"
        actions: "q002_2_talk_1"
        conditions: "paradozQuests-lia>q002_done,paradozQuests-lia>q002_1_done,!q002_2_active,!q002_2_done"
      q002_2_start1:
        text: "Нет. Просто красивые цветы. Иногда человеку нужны красивые вещи.\nХочется красных и синих цветов."
        actions: "start_q002_2,q002_2_talk_2"
      q002_2_check:
        text: "Уже собрал цветы? Поторопись)"
        conditions: "q002_2_active,!q002_2_done,!q002_2_flowers"
        pointers: "q002_2_notyet"
      q002_2_fin:
        conditions: "q002_2_active,q002_2_flowers,!q002_2_done"
        text: "Спасибо. Даже не представляешь, как давно мне никто не дарил цветы, кроме Тома. Но если он подарит ещё один одуванчик… я его прибью.\nЯ приготовила пирог. Бери, не стесняйся."
        actions: "q002_2_take,finish_q002_2,q002_2_inc,q002_2_reward,q002_2_talk_3"


    player_options:

      ############################################################################################
      #       ГЛАВА 1
      ############################################################################################

      ##############################################
      #    ГЛАВА 1 Доп. 2.2
      ##############################################

      #######################
      #   q002_2 - квест 2.2
      #######################

      q002_2_1:
        text: "Для лекарства?"
        pointers: "q002_2_start1"
      q002_2_notyet:
        text: "Цветов пока нет с собой."
