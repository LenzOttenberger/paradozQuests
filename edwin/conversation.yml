conversations:
  Edwin:
    quester: "Эдвин"
    first: "q001_outro_start,q001_check,q001_intro,default"

    NPC_options:

      ############################################################################################
      #    ГЛАВА 1 q004_fin1,q004_check,q004_start,
      ############################################################################################
    
      #######################
      #    q001 - квест 1.0
      #######################
      default:
        text: "Привет, друг"

      q001_intro:
        text: "Добро пожаловать. Я Эдвин, слежу за часами в этом… Когда то это был город, а сейчас это стало деревней. Многие привыкли называть Аэрис городом, поэтому не путайся. Ну что ж! Новый день начинается как обычно…Наверное. Если подумать... Я уже говорил это сегодня…Не могу вспомнить кому. Ладно. Неважно. Город всегда рад новым людям. У меня небольшая просьба к тебе, а точнее хочу чтобы ты познакомился с нашими жителями немного поближе. Нас в деревне меньше десяти человек и я считаю что ты должен познакомится со всеми. Так будет проще в будущем."
        pointers: "q001_good,q001_why"
        actions: "q001_talk_1"
        conditions: "!q001_done"
      q001_start:
        text: "Зачем? Думаю тебе станет тут не так одиноко. Ты же один?"
        actions: "q001_start,q001_exp,q001_talk_2"
      q001_check:
        text: "Ну что? Успел поговорпить со всеми?"
        pointers: "q001_no"
        conditions: "q001_active,!q001_talks_done,!q001_done"
      q001_outro_start:
        text: "Ты достаточно быстро. Неужели Том был не разговорчив? Может просто не его день сегодня, либо опять не успел позавтракать. Мне пора идти. Работа так сказать. Так… Хммм….. ….. Вот и всё. Думаю теперь я смогу позвать тебя в любое время."
        pointers: "q001_wtf"
        conditions: "q001_talks_done,!q001_done,q001_active"
        actions: "finish_q001,q001_talk_3"
      q001_outro_end:
        text: "Это секрет, но потерпи чуток, тебе скоро станет легче. Зато я или кто-то из жителей сможет позвать тебя в любое время. А теперь мне точно пора бежать, часы не ждут!"
        actions: "q001_talk_4"

      #######################
      #    q004 - квест 4.0
      #######################

      q004_start:
        text: "Привет, дружок. Есть минутка?\nУ меня тут небольшая проблема. Хмм... Эти часы опять показывают что-то странное.\nХотя нет, наверное, не часы. Или часы. Трудно сказать.\nПонимаешь, за главной башней я слежу каждый день.\nСмазываю механизм. Проверяю стрелки. Подкручиваю шестерёнки. Работа скучная, зато важная.\nЕсли часы перестанут работать, люди начнут постоянно спрашивать у меня время. А я этого очень не люблю.\nВ общем, можешь проверить остальные часы в деревне?/nПросто посмотри, всё ли там в порядке. И возвращайся ко мне.\nОни находятся у Лии, Лорана и в доме Тома."
        conditions: ""
        actions: "q004_start,q004_talk_1"
      q004_check:
        text: "Проверил часы?"
        conditions: "q004_active,!q004_done"
        pointers: "q004_notyet"
      q004_fin1:
        text: "Ну как? Надеюсь, всё нормально? У всех одинаковое время?"
        pointers: "q004_1"
        actions: "q004_talk_2"
        conditions: "q004_active,q004_locs,!q004_done"
      q004_fin2:
        text: "Разное? Серьёзно? Странно... Очень странно.\nЯ ведь утром всё проверял. Ну... Почти уверен, что проверял.\nХотя утро сегодня было какое-то суматошное.\nРой опять что-то строил. Том опять куда-то бежал. Лия опять на кого-то злилась.\nДа и я сам отвлёкся несколько раз. Ладно. Значит, придётся всё осматривать заново.\nЕсли механизм разболтался, сам себя он точно не починит.\nСпасибо за помощь, дружок. Без тебя я бы до следующего утра не узнал бы об этой проблеме.\nДержи награду. А мне пора искать инструменты. Надеюсь, я помню, куда их положил."
        actions: "q004_inc,q004_talk_3,finish_q004"



    player_options:

      ############################################################################################
      #    ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      q001_good:
        text: "Хорошо!"
        actions: "q001_start,q001_exp"
      q001_why:
        text: "Зачем мне это делать?"
        pointers: "q001_start"
      q001_no: 
        text: "Ещё нет, но я обязательно это сделаю."
      q001_wtf:
        text: "Что ты сделал?"
        pointers: "q001_outro_end"

      #######################
      #    q004 - квест 4.0
      #######################

      q004_1:
        text: "У всех разное время."
        pointers: "q004_fin2"
      q004_notyet:
        text: "Ещё не проверил."