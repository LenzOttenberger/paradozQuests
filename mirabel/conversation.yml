conversations:
  Mirabel:
    quester: "Мирабель"
    first: "q001_active,default"

    NPC_options:

      ############################################################################################
      #    ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      default:
        text: "Здравствуйте."
      q001_active:
        conditions: "q001_active,!q001_done"
        text: "Привет? Ты новый житель? Не похоже…"
        actions: "q001_talk_1"
        pointers: "q001_answer"
      q001_name:
        text: "Теперь понятно. Тогда приятно познакомиться, меня зовут Мирабель.\nЯ заведую библиотекой."
        pointers: "q001_continue"
        actions: "q001_talk_2"
      q001_end:
        text: "Я не очень разговорчива. Приходи по делу."
        actions: "q001_stage,q001_talk_3"

      #######################
      #    q003 - квест 3.0
      #######################
      q003_active:
        text: "Ты пришёл. Хорошо.\nЯ бы попросила кого-нибудь другого, но все заняты.\nИли мне кажется, что заняты. Иногда сложно понять.\nВ общем... Несколько книг до сих пор не вернули в библиотеку.\nНе мог бы ты поискать их для меня?"
        pointers: "q003_1,q003_1.1"
        actions: "q003_talk_1"
      q0033:
        text: "Ну и хорошо. Жду."
        actions: "q003_talk_2"
      q0033_1:
        text: "Понимаю. Но книги всё равно придётся вернуть."
        actions: "q003_talk_3"
      q003_check:
        text: "Книги у тебя?"
        conditions: "q003_active"
        pointers: "q003_notyet"
      q003_vce:
        text: "Все книги на месте. Странно…\nЯ уверена, что одной из этих книг никогда никогда у нас не было…\nНаверное, ошиблась."
        pointers: "q003_2,q003_2.1"
        actions: "q003_talk_4"
      q0033_2:
        text: "Конечно. Люди почему-то всегда ждут награду. Держи.\nИ... Если найдёшь книгу, в которой будет написано что-то про будущее…\nНе спеши ей верить. Кто-то просил передать тебе эти слова… Но я не помню кто…\nПо крайней мере... Мне так кажется"
        actions: "finish_q003,q003_talk_5"
      q0033_22:
        text: "Спасибо. Не все готовы тратить своё время на чужие проблемы.\nИ... Если найдёшь книгу, в которой будет написано что-то про будущее…\nНе спеши ей верить. Кто-то просил передать тебе эти слова… Но я не помню кто…\nПо крайней мере... Мне так кажется"
        actions: "finish_q003,q003_talk_6"


        

    player_options:

      ############################################################################################
      #    ГЛАВА 1
      ############################################################################################

      #######################
      #    q001 - квест 1.0
      #######################

      q001_answer:
        text: "Я случайно сюда попал и мне сказали познакомиться со всеми."
        pointers: "q001_name"
      q001_continue:
        text: "..."
        pointers: "q001_end"

      #######################
      #    q003 - квест 3.0
      #######################
      q003_1:
        text: "Конечно."
        pointers: "q0033"
      q003_1.1:
        text: "Нет."
        pointers: "q0033_1"
      q003_2:
        text: "А награда?"
        pointers: "q0033_2"
      q003_2.1:
        text: "Было несложно."
        pointers: "q0033_22"
      q003_notyet:
        text: "Нет"